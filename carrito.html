<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | CampusShop</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="cart">
    <header class="main-header">
        <div class="header-container">
            <input type="checkbox" id="menu-toggle" class="menu-checkbox">
            <label for="menu-toggle" class="hamburger-btn"><span></span><span></span><span></span></label>
            <nav class="side-menu">
                <ul>
                    <li><a href="index.html">🏠 Inicio</a></li>
                    <li><a href="catalogo.html">📂 Catálogo</a></li>
                    <li><a href="carrito.html">🛒 Carrito <span class="cs-nav-count" data-cart-count>0</span></a></li>
                    <li><a href="perfil.html">👤 Perfil</a></li>
                </ul>
            </nav>
            <div class="logo-container">
                <img src="img/logo-jinx.png" class="logo-img" alt="Logo">
                <h1 class="logo-text">MI <span class="flicker">CARRITO</span></h1>
            </div>
        </div>
    </header>

    <main class="content cart-layout">
        <section class="cart-items" aria-live="polite"></section>

        <aside class="cart-summary">
            <div class="summary-details">
                <div class="summary-line">
                    <span>Subtotal</span>
                    <span data-subtotal>$0.00</span>
                </div>
                <div class="summary-line">
                    <span>IVA (12%)</span>
                    <span data-tax>$0.00</span>
                </div>
                <hr class="summary-divider">
                <div class="summary-line total">
                    <span>Total</span>
                    <span class="total-price" data-total>$0.00</span>
                </div>
            </div>
            <button type="button" class="btn-jinx btn-pay">PROCEDER AL PAGO</button>
        </aside>
    </main>

    <footer class="main-footer">
        <p>2026 | JinxShop. Todos los derechos reservados.</p>
    </footer>
    <script src="js/data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/pages.js"></script>
</body>
</html>
