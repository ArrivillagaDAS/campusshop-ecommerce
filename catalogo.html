<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | CampusShop</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="catalog">
    <header class="main-header">
        <div class="header-container">
            <input type="checkbox" id="menu-toggle" class="menu-checkbox">
            <label for="menu-toggle" class="hamburger-btn"><span></span><span></span><span></span></label>
            <nav class="side-menu">
                <ul>
                    <li><a href="index.html">🏠 Inicio</a></li>
                    <li><a href="catalogo.html">📂 Catálogo</a></li>
                    <li><a href="carrito.html">🛒 Carrito <span class="cs-nav-count" data-cart-count>0</span></a></li>
                    <li><a href="perfil.html">👤 Perfil</a></li>
                </ul>
            </nav>
            <div class="logo-container">
                <img src="img/logo-jinx.png" class="logo-img" alt="Logo">
                <h1 class="logo-text">JINX <span class="flicker">SHOP</span></h1>
            </div>
        </div>
    </header>

    <main class="content catalog-layout">
        <aside class="filters">
            <h3>CATEGORÍAS</h3>
            <div class="filter-group">
                <a href="#ropa" class="filter-link">ROPA</a>
                <a href="#gorros" class="filter-link">GORROS</a>
                <a href="#joyeria" class="filter-link">JOYERIA</a>
            </div>
        </aside>

        <div class="products-container">
            <div class="search-container cs-catalog-search">
                <i class="search-icon">🔍</i>
                <input type="search" class="jinx-search" data-catalog-search placeholder="Buscar en el catálogo..." aria-label="Buscar en el catálogo">
            </div>
            <div data-catalog>
                <noscript><p>Activa JavaScript para ver el catálogo.</p></noscript>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <p>2026 | JinxShop. Todos los derechos reservados.</p>
    </footer>
    <script src="js/data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/pages.js"></script>
</body>
</html>
